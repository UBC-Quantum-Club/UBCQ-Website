<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - UBC Quantum Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Exo+2:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="contact-page">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html" class="nav-brand-link">
                    <img src="ubcq logo.png" alt="UBC Quantum Club Logo" class="logo">
                    <h1>UBC Quantum Club</h1>
                </a>
            </div>
            <div class="nav-links">
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
                <div class="nav-actions">
                    <label class="nav-search">
                        <span class="sr-only">Search</span>
                        <input type="search" placeholder="Search...">
                    </label>
                    <a class="btn-nav" href="contact.html">Join Now</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="contact-hero">
        <div class="contact-overlay"></div>
        <div class="contact-shell">
            <div class="contact-card">
                <h2 class="contact-title">CONTACT US</h2>
                <p class="contact-subtitle">How can we help?</p>
                <form class="contact-form" action="#" method="post">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label for="question">I'd Like To Ask About..</label>
                        <select id="question" name="question" required>
                            <option value="" disabled selected>I'd Like To Ask About...</option>
                            <option value="membership">Membership</option>
                            <option value="events">Events</option>
                            <option value="workshops">Workshops</option>
                            <option value="sponsorship">Sponsorship</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Tell us what you'd like to know..." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary contact-submit">Submit</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-social">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p>&copy; 2024 UBC Quantum Club. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
